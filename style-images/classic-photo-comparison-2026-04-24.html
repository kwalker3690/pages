<script>
const data = JSON.parse(document.getElementById('ds').textContent);
const prompts = [...new Set(data.map(d => d.prompt_key))].sort();
let activeTier = 'plus';

function render() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  prompts.forEach(pk => {
    const section = document.createElement('div');
    section.className = 'prompt-section';
    const title = document.createElement('div');
    title.className = 'prompt-title';
    title.textContent = pk.replace(/-/g, ' ');
    section.appendChild(title);

    const legR1 = data.find(d => d.prompt_key === pk && d.tier === 'legacy' && d.run === 'v1');
    const legR5 = data.find(d => d.prompt_key === pk && d.tier === 'legacy' && d.run === 'v6');
    const styV5 = data.find(d => d.prompt_key === pk && d.tier === activeTier && d.run === 'v6');

    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
    grid.style.gap = '10px';
    grid.style.alignItems = 'start';

    [
      { item: legR1, lbl: 'legacy (run 1)' },
      { item: legR5, lbl: 'legacy (run 5)' },
      { item: styV5, lbl: 'classic_photo v6' },
    ].forEach(({item, lbl}) => {
      if (!item) return;
      const cell = document.createElement('div');
      cell.className = 'cell';
      const img = document.createElement('img');
      img.src = item.url;
      img.loading = 'lazy';
      img.onclick = (e) => { e.stopPropagation(); document.getElementById('modal-img').src = item.url; document.getElementById('modal').classList.add('open'); };
      const labelEl = document.createElement('div');
      labelEl.className = 'label';
      labelEl.textContent = lbl;
      const modelEl = document.createElement('div');
      modelEl.className = 'model';
      modelEl.textContent = item.model;
      cell.appendChild(img);
      cell.appendChild(labelEl);
      cell.appendChild(modelEl);
      grid.appendChild(cell);
    });

    section.appendChild(grid);
    gallery.appendChild(section);
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTier = tab.dataset.tier;
    render();
  });
});

render();
</script>
</body>
</html>
