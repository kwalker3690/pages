<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenic Illustration: All Models Comparison</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #AABCB6; color: #2B2E3C; padding: 20px; }
h1 { margin-bottom: 8px; font-size: 22px; color: #2C3F42; }
.subtitle { color: #4a5a5e; margin-bottom: 20px; font-size: 14px; }
.cost-note { margin-bottom: 20px; background: #FFF8F0; padding: 10px 14px; border-radius: 8px; border: 1px solid #C3CDC1; font-size: 13px; display: flex; gap: 20px; flex-wrap: wrap; }
.cost-note .credits { font-weight: 600; }
.filters { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.filters label { font-size: 13px; color: #2C3F42; }
.filters select { background: #FFF8F0; color: #2B2E3C; border: 1px solid #C3CDC1; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
.row-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
.row-card { background: #FFF8F0; border-radius: 8px; padding: 14px; border: 1px solid #C3CDC1; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.row-header { font-size: 13px; color: #4a5a5e; margin-bottom: 10px; }
.row-header strong { color: #2C3F42; }
.row-header .style-tag { display: inline-block; background: #FBE2D1; color: #6a4a2a; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 6px; }
.images { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.img-card { text-align: center; }
.img-card img { width: 100%; border-radius: 4px; cursor: pointer; transition: transform 0.2s; }
.img-card img:hover { transform: scale(1.02); }
.img-card .model-label { font-size: 11px; margin-top: 4px; font-weight: 500; }
.c-flash { color: #6a1a9a; } .c-mini { color: #1a6a9a; } .c-flux { color: #9a4a1a; } .c-ideo { color: #1a7a4a; }
.lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
</style>

<body>

const MODELS = [
  { key:"ideogram-v3-flash", label:"ideogram-v3-flash (3cr)", cls:"c-flash" },
  { key:"gpt-image-1-mini-medium", label:"gpt-image-1-mini-medium (8cr)", cls:"c-mini" },
  { key:"flux-2-pro", label:"flux-2-pro (8cr)", cls:"c-flux" },
  { key:"ideogram-v3", label:"ideogram-v3 (20cr)", cls:"c-ideo" },
];
function openLB(s) { document.getElementById("lbi").src=s; document.getElementById("lb").classList.add("active"); }
function init() {
  const goodRows = DATA.filter(r => r.model_used === r.model_override);
  const groups = {};
  for (const r of goodRows) {
    const k = r.prompt+"|||"+r.style_reference_key;
    if (!groups[k]) groups[k] = { prompt: r.prompt, style: r.style_reference_key, imgs: {} };
    groups[k].imgs[r.model_override] = r;
  }
  const fp = document.getElementById("fp"), fs = document.getElementById("fs");
  [...new Set(goodRows.map(r=>r.prompt))].forEach(p=>{const o=document.createElement("option");o.value=p;o.text=p;fp.add(o);});
  [...new Set(goodRows.map(r=>r.style_reference_key))].forEach(s=>{const o=document.createElement("option");o.value=s;o.text=s;fs.add(o);});
  const grid = document.getElementById("grid"), entries = Object.values(groups);
  function render() {
    grid.innerHTML = "";
    for (const g of entries) {
      if (fp.value!=="all"&&g.prompt!==fp.value) continue;
      if (fs.value!=="all"&&g.style!==fs.value) continue;
      const div = document.createElement("div"); div.className="row-card";
      let ih = "";
      for (const m of MODELS) {
        const img = g.imgs[m.key];
        ih += '<div class="img-card">'+(img&&img.output_image?'<img src="'+img.output_image+'" onclick="openLB(''+img.output_image+'')" loading="lazy">':'<div style="padding:40px;color:#bbb;font-size:12px">not generated</div>')+'<div class="model-label '+m.cls+'">'+m.label+'</div></div>';
      }
      div.innerHTML = '<div class="row-header"><strong>'+g.prompt+'</strong> <span class="style-tag">'+g.style+'</span></div><div class="images">'+ih+'</div>';
      grid.appendChild(div);
    }
  }
  fp.addEventListener("change", render); fs.addEventListener("change", render); render();
}
init();
