.img-card { text-align: center; }
.img-card img { width: 100%; border-radius: 4px; cursor: pointer; transition: transform 0.2s; }

.img-card .fallback { color: #c33; }
.summary { margin-bottom: 20px; background: #FFF8F0; padding: 12px 16px; border-radius: 8px; border: 1px solid #C3CDC1; font-size: 13px; }
.summary strong { color: #1a6a9a; }

      if (fs!=="all"&&pair.style!==fs) continue;
